<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StreamVerse - Video Collection</title>
<meta name="description" content="Video Collection - Watch the latest videos on StreamVerse.">
<meta name="theme-color" content="#F5F0E6">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}
body{margin:0;background:#F5F0E6;color:#30251D;font-family:Arial,sans-serif}

/* HEADER */
header{padding:8px 5%;background:#FFFDF8;border-bottom:1px solid #E3D8C9}
.logo{display:flex;align-items:center;justify-content:center;width:100%}
.logo-text{display:block;font-family:'Orbitron',sans-serif;font-size:clamp(18px,5vw,30px);font-weight:900;letter-spacing:1px;color:#D96B0B;text-align:center}

/* KONTEN */
.container{max-width:1200px;margin:auto;padding:25px}
.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:25px}
.top h2{font-size:23px;color:#D96B0B;margin:0}
.tabs{display:flex;background:#E8DFD2;border-radius:40px;padding:5px;gap:3px}
.tabs button{border:0;background:transparent;color:#30251D;padding:12px 17px;border-radius:30px;font-weight:bold;cursor:pointer}
.tabs button.active{background:#FF8C24;color:#FFFFFF}

/* PENCARIAN */
.search{width:100%;max-width:350px;padding:13px;background:#FFFDF8;border:1px solid #D8CBB9;border-radius:9px;color:#30251D;outline:none;margin-bottom:22px;caret-color:#FF8C24}
.search::placeholder{color:#9A8B7B;opacity:1}
.search:focus{border-color:#FF8C24}

/* VIDEO PLAYER */
.player-section{display:none;margin-bottom:30px}
.player-section.show{display:block}
.player{width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden}
.player iframe{width:100%;height:100%;border:0;display:block;background:#000}
.player-info{padding:12px 2px}
.player-info h2{font-size:20px}
.player-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.close-player{background:#FF8C24;border:0;padding:10px 18px;border-radius:7px;color:#FFFFFF;font-weight:bold;cursor:pointer}
.direct-link{display:inline-block;background:#38291D;color:#FFB36B;padding:10px 15px;border-radius:7px;text-decoration:none;font-size:13px;font-weight:bold}

/* GRID VIDEO */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px}
.card{background:#FFFDF8;border:1px solid #59402C;border-radius:17px;overflow:hidden;cursor:pointer;transition:.2s}
.card:hover{transform:translateY(-4px);border-color:#FF8C24}
.thumb{position:relative;width:100%;aspect-ratio:16/9;background:#E8DFD2;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.play-icon{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:48px;height:48px;border-radius:50%;background:#FF8C24;display:flex;align-items:center;justify-content:center;color:white;font-size:21px;padding-left:3px}
.details{padding:13px}
.details h3{font-size:17px;line-height:1.35;margin:0 0 15px;min-height:45px;color:#D96B0B}
.meta{display:flex;justify-content:space-between;align-items:center;color:#75685B;font-size:13px;gap:5px}
.duration{background:#30251D;padding:8px 10px;border-radius:8px;color:white}

/* PAGINATION */
.pagination{display:flex;justify-content:center;align-items:center;gap:10px;margin:30px 0;flex-wrap:wrap}
.pagination button{min-width:42px;height:42px;border:1px solid #59402C;border-radius:9px;background:#FFFDF8;color:#30251D;font-size:15px;font-weight:bold;cursor:pointer}
.pagination button.active{background:#FF8C24;color:#FFFFFF;border-color:#FF8C24}
.pagination button:disabled{opacity:.4;cursor:not-allowed}
.empty{grid-column:1/-1;text-align:center;padding:30px;color:#75685B}

/* FOOTER */
footer{margin-top:40px;text-align:center;background:#FFFDF8;padding:25px;color:#75685B;font-size:13px}

/* POPUP SMARTLINK */
.ad-overlay{display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.72);align-items:center;justify-content:center;padding:18px}
.ad-overlay.show{display:flex}
.ad-box{width:100%;max-width:380px;position:relative;background:#FFFDF8;border:2px solid #FF8C24;border-radius:16px;padding:30px 22px 24px;text-align:center;box-shadow:0 15px 45px rgba(0,0,0,.3);animation:popupIn .25s ease}
@keyframes popupIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
.ad-close{position:absolute;top:9px;right:10px;width:34px;height:34px;border:0;border-radius:50%;background:#F0E6DA;color:#30251D;font-size:23px;font-weight:bold;cursor:pointer}
.ad-close:hover{background:#FF8C24;color:#FFFFFF}
.ad-brand{display:block;color:#D96B0B;font-size:13px;font-weight:900;letter-spacing:1px;margin-bottom:15px}
.ad-box h3{color:#30251D;font-size:21px;margin:0 0 12px}
.ad-box p{color:#75685B;font-size:13px;line-height:1.6;margin:0 0 20px}
.ad-button{display:block;width:100%;padding:13px;border-radius:9px;background:#FF8C24;color:#FFFFFF;font-size:14px;font-weight:bold;text-decoration:none}
.ad-button:hover{background:#D96B0B}

/* TAMPILAN MOBILE */
@media(max-width:650px){
header{padding:1px 18px}
.logo img{height:50px;max-width:500px}
.container{padding:17px}
.top{align-items:flex-start;flex-direction:column;gap:12px}
.top h2{font-size:21px}
.tabs{width:100%;justify-content:space-between}
.tabs button{padding:11px 15px;font-size:13px}
.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.details{padding:11px}
.details h3{font-size:15px;min-height:42px}
.meta{font-size:11px}
.duration{padding:7px}
}
</style>
</head>

<body>

<header>
<div class="logo"><span class="logo-text">🔥STREAMVERSE🔥</span></div>
</header>

<main class="container">
<div class="top">
<h2>Video Collection</h2>
<div class="tabs">
<button class="active" data-sort="new">New</button>
<button data-sort="trending">Trending</button>
<button data-sort="oldest">Oldest</button>
</div>
</div>

<input class="search" id="search" type="search" placeholder="Search videos..." autocomplete="off">

<section class="player-section" id="playerSection">
<div class="player">
<iframe id="videoFrame" src="about:blank" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen loading="eager" title="StreamVerse Video Player"></iframe>
</div>
<div class="player-info">
<h2 id="playingTitle">Video Title</h2>
<div class="player-actions">
<button class="close-player" id="closePlayer">Close Video</button>
<a class="direct-link" id="directLink" href="#" target="_blank" rel="noopener noreferrer">Open Full Size</a>
</div>
</div>
</section>

<div class="grid" id="videoGrid"></div>
<div class="pagination" id="pagination"></div>
</main>

<footer>© 2026 StreamVerse. All Rights Reserved.</footer>

<div class="ad-overlay" id="adOverlay">
<div class="ad-box">
<button class="ad-close" id="adClose" aria-label="Close popup">×</button>
<div class="ad-brand">🔥 STREAMVERSE</div>
<h3>Ada Penawaran Menarik!</h3>
<p>Temukan berbagai penawaran menarik. Klik tombol di bawah untuk melihat selengkapnya.</p>
<a class="ad-button" id="adButton" href="https://emotionallytonightintelligent.com/bwuq2bmay8?key=64b01feeb25c6433602effa9db70338d" target="_blank" rel="noopener noreferrer">Lihat Penawaran</a>
</div>
</div>

<script>
(function(){

/* 1. CONFIGURATION */
const BASE_URL="https://trbnvideo.live/e/";
const SMARTLINK_URL="https://emotionallytonightintelligent.com/bwuq2bmay8?key=64b01feeb25c6433602effa9db70338d";
const PER_PAGE=9;
const AD_DELAY=7000;
const MAX_AD_SHOW=3;

/* 2. VIDEO DATABASE */
const videos=[
{title:"Tante Hijab",id:"o0m66zOJ",date:20,image:"https://i.ibb.co/QFTkGKWk/Screenshot-2026-11-04-01-32-14-655-com-android-chrome-edit.jpg"},
{title:"Hijab Makan Es Krim Diwarung",id:"Yui2HawX",date:19,image:"https://i.ibb.co/ywGtpfT/Screenshot-2026-11-04-01-32-51-964-com-android-chrome-edit.jpg"},
{title:"Hijab Long Duration",id:"yPCpIeE2",date:18,image:"https://i.ibb.co/ZpC8Rkmg/Screenshot-2026-11-04-01-34-16-221-com-android-chrome-edit.jpg"},
{title:"Main Sama Temen Kerja",id:"0f1D6USB",date:17,image:"https://i.ibb.co/8DHGSYfN/Screenshot-2026-11-04-01-35-25-739-com-android-chrome-edit.jpg"},
{title:"Gangguin Pacar Orang Pas Lagi Telfonan",id:"UEfbqiOJ",date:16,image:"https://i.ibb.co/WWzD8zj3/Screenshot-2026-11-04-01-35-59-649-com-android-chrome-edit.jpg"},
{title:"Ojol yang Beruntung",id:"gHjMMnJy",date:15,image:"https://i.ibb.co/VczqwJ7W/Screenshot-2026-11-04-01-36-45-302-com-android-chrome-edit.jpg"},
{title:"Awalnya Nolak Akhirnya Mau Juga",id:"rb4Wuf6R",date:14,image:"https://i.ibb.co/SDGR4p4X/Screenshot-2026-11-04-01-37-19-017-com-android-chrome-edit.jpg"},
{title:"Nekat Maen di Ruang Tamu",id:"BOjsEIwC",date:13,image:"https://i.ibb.co/Kc4Cn0RF/Screenshot-2026-11-04-01-38-51-649-com-android-chrome-edit.jpg"},
{title:"ABG Sekarang Udah Pada Pinter",id:"RBwdzWn9",date:12,image:"https://i.ibb.co/SDfNmHRw/Screenshot-2026-11-04-01-40-14-232-com-android-chrome-edit.jpg"},
{title:"Sendirian di Rumah Katanya",id:"VpyWLOH4",date:11,image:"https://i.ibb.co/9k1k2PtC/Screenshot-2026-11-04-01-40-50-749-com-android-chrome-edit.jpg"},
{title:"Lagi Asik Malah Ketahuan Abang",id:"DHPaiZhN",date:10,image:"https://i.ibb.co/MkQK0Bk5/Screenshot-2026-11-04-01-41-28-925-com-android-chrome-edit.jpg"},
{title:"Eue Kakak Lagi Masak",id:"wX7fr5G6",date:9,image:"https://i.ibb.co/60mD1DNm/Screenshot-2026-11-04-02-16-43-013-com-android-chrome-edit.jpg"},
{title:"Body Mantap",id:"QhFMCodt",date:8,image:"https://i.ibb.co/v4VN53v9/Screenshot-2026-11-04-01-42-42-056-com-android-chrome-edit.jpg"},
{title:"Istri Chindo Fetish Pakai Kain Jarik",id:"O7PU9w8K",date:7,image:"https://i.ibb.co/RpqqX64H/Screenshot-2026-11-04-01-43-09-690-com-android-chrome-edit.jpg"},
{title:"HALLO ME Ngeprank Ojol",id:"PMa41iLr",date:6,image:"https://i.ibb.co/cKTTnc8b/Screenshot-2026-11-04-01-43-39-916-com-android-chrome-edit.jpg"},
{title:"Malem Minggu Maen di Hotel Sama Ayang",id:"Pz88uxq9",date:5,image:"https://i.ibb.co/0VB1BhKy/Screenshot-2026-11-04-01-44-30-308-com-android-chrome-edit.jpg"},
{title:"Tidurin Cewek Tatto Mawar Teman Nongkrong",id:"lOszprtI",date:4,image:"https://i.ibb.co/wrMXWsLB/Screenshot-2026-11-04-02-20-46-138-com-android-chrome-edit.jpg"},
{title:"Awalnya Nolak Endingnya Becek Juga",id:"4PBt279V",date:3,image:"https://i.ibb.co/4wF0twp6/Screenshot-2026-11-04-01-46-19-897-com-android-chrome-edit.jpg"},
{title:"Hijab dan Dua Teman Laki-Lakinya",id:"tdfMIvT4",date:2,image:"https://i.ibb.co/zhkPcw2G/Screenshot-2026-11-04-02-12-31-653-com-android-chrome-edit.jpg"},
{title:"Longdur Kolpri Salma Alea",id:"dwxcugp6",date:1,image:"https://i.ibb.co/B5H1HqfG/Screenshot-2026-11-04-02-14-00-427-com-android-chrome-edit.jpg"}
];

/* 3. ELEMENT DAN STATUS */
let currentPage=1,currentSort="new",adTimer=null,adShownCount=0;
const grid=document.getElementById("videoGrid");
const pagination=document.getElementById("pagination");
const search=document.getElementById("search");
const playerSection=document.getElementById("playerSection");
const videoFrame=document.getElementById("videoFrame");
const playingTitle=document.getElementById("playingTitle");
const directLink=document.getElementById("directLink");
const adOverlay=document.getElementById("adOverlay");
const adClose=document.getElementById("adClose");
const adButton=document.getElementById("adButton");

/* 4. MENGAMBIL DAN MENGURUTKAN VIDEO */
function getVideos(){
const query=search.value.toLowerCase().trim();
let data=videos.filter(video=>video.title.toLowerCase().includes(query)||video.id.toLowerCase().includes(query));
if(currentSort==="new")data.sort((a,b)=>b.date-a.date);
if(currentSort==="oldest")data.sort((a,b)=>a.date-b.date);
if(currentSort==="trending"){
data.sort((a,b)=>{
const aClicks=Number(localStorage.getItem("StreamVerse_"+a.id)||0);
const bClicks=Number(localStorage.getItem("StreamVerse_"+b.id)||0);
return bClicks-aClicks;
});
}
return data;
}

/* 5. POPUP SMARTLINK */
function scheduleAd(){
clearTimeout(adTimer);
if(adShownCount>=MAX_AD_SHOW)return;
if(!playerSection.classList.contains("show"))return;
adTimer=setTimeout(()=>{
adShownCount++;
adOverlay.classList.add("show");
},AD_DELAY);
}

function closeAd(openLink){
adOverlay.classList.remove("show");
if(openLink)window.open(SMARTLINK_URL,"_blank");
scheduleAd();
}

adClose.addEventListener("click",()=>closeAd(true));
adButton.addEventListener("click",()=>closeAd(false));

/* 6. MEMBUKA VIDEO */
function openVideo(video){
const url=BASE_URL+video.id;
window.open(SMARTLINK_URL,"_blank");
playingTitle.textContent=video.title;
videoFrame.src=url;
directLink.href=url;
playerSection.classList.add("show");

const key="StreamVerse_"+video.id;
const clicks=Number(localStorage.getItem(key)||0);
localStorage.setItem(key,clicks+1);

adShownCount=0;
scheduleAd();

playerSection.scrollIntoView({behavior:"smooth",block:"start"});
}

/* 7. MENUTUP VIDEO */
function closeVideo(){
clearTimeout(adTimer);
adOverlay.classList.remove("show");
videoFrame.src="about:blank";
playerSection.classList.remove("show");
}

document.getElementById("closePlayer").addEventListener("click",closeVideo);

/* 8. MENAMPILKAN DAFTAR VIDEO */
function renderVideos(){
const data=getVideos();
const totalPages=Math.max(1,Math.ceil(data.length/PER_PAGE));
currentPage=Math.min(currentPage,totalPages);
const start=(currentPage-1)*PER_PAGE;
const pageVideos=data.slice(start,start+PER_PAGE);
grid.innerHTML="";

if(pageVideos.length===0)grid.innerHTML='<div class="empty">Video tidak ditemukan.</div>';

pageVideos.forEach(video=>{
const card=document.createElement("div");
card.className="card";
card.innerHTML=`
<div class="thumb">
<img src="${video.image}" alt="${video.title}" loading="lazy">
<div class="play-icon">▶</div>
</div>
<div class="details">
<h3></h3>
<div class="meta">
<span>StreamVerse</span>
<span class="duration"></span>
</div>
</div>
`;
card.querySelector("h3").textContent=video.title;
card.addEventListener("click",()=>openVideo(video));
grid.appendChild(card);
});

renderPagination(totalPages);
}

/* 9. PAGINATION */
function renderPagination(totalPages){
pagination.innerHTML="";
if(totalPages<=1)return;

const prev=document.createElement("button");
prev.textContent="‹";
prev.disabled=currentPage===1;
prev.onclick=()=>{currentPage--;renderVideos()};
pagination.appendChild(prev);

for(let i=1;i<=totalPages;i++){
const button=document.createElement("button");
button.textContent=i;
if(i===currentPage)button.className="active";
button.onclick=()=>{currentPage=i;renderVideos()};
pagination.appendChild(button);
}

const next=document.createElement("button");
next.textContent="›";
next.disabled=currentPage===totalPages;
next.onclick=()=>{currentPage++;renderVideos()};
pagination.appendChild(next);
}

/* 10. TAB NEW, TRENDING, OLDEST */
document.querySelectorAll(".tabs button").forEach(button=>{
button.addEventListener("click",function(){
currentSort=this.dataset.sort;
currentPage=1;
document.querySelectorAll(".tabs button").forEach(tab=>tab.classList.remove("active"));
this.classList.add("active");
renderVideos();
});
});

/* 11. PENCARIAN VIDEO */
search.addEventListener("input",()=>{
currentPage=1;
renderVideos();
});

/* 12. JALANKAN HALAMAN */
renderVideos();

})();
</script>
</body>
</html>
